<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShopSmart - Premium Store</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>

  <style>
    :root {
      --primary: #4c1785;
      --secondary: #2575fc;
      --accent: #ff9800;
      --white: #fff;
      --text: #333;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-image: url('web.jpeg'); /* <-- **CHANGE THIS TO YOUR IMAGE PATH** */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      height: 100vh;
      overflow: hidden; /* Kept as per original design */
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      color: var(--text);
    }

    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      background-color: rgba(0, 0, 0, 0.3); /* Darkens the image slightly */
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.2);
      animation: float 10s infinite ease-in-out;
    }

    .bubble:nth-child(1) {
      width: 120px;
      height: 120px;
      left: 10%;
      top: 20%;
      animation-duration: 14s;
    }

    .bubble:nth-child(2) {
      width: 80px;
      height: 80px;
      left: 70%;
      top: 10%;
      animation-duration: 18s;
    }

    .bubble:nth-child(3) {
      width: 100px;
      height: 100px;
      left: 50%;
      top: 60%;
      animation-duration: 16s;
    }

    /* Sparkle styles */
    .sparkle {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      animation: twinkle 5s infinite ease-in-out;
    }

    .sparkle:nth-child(4) { /* Starting from 4th child since 1-3 are bubbles */
      width: 5px;
      height: 5px;
      left: 25%;
      top: 50%;
      animation-duration: 4s;
      animation-delay: 1s;
    }
    .sparkle:nth-child(5) {
      width: 8px;
      height: 8px;
      left: 80%;
      top: 30%;
      animation-duration: 6s;
      animation-delay: 2s;
    }
    .sparkle:nth-child(6) {
      width: 6px;
      height: 6px;
      left: 40%;
      top: 80%;
      animation-duration: 5.5s;
      animation-delay: 0.5s;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 0.7; }
      50% { transform: translateY(-30px) scale(1.1); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 0.7; }
    }

    @keyframes twinkle {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.5); }
    }

    .container {
      background-color: var(--white);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 600px;
      width: 90%;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 1;
      animation: slideDown 1s ease-out;
    }

    @keyframes slideDown {
      from { transform: translateY(-100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .logo {
      font-size: 48px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    
      -webkit-text-fill-color:white;
      margin-bottom: 20px;
      animation: glow 2s infinite alternate;
      display: inline-block;
    }

    .shopsmart-logo { /* Specific style for ShopSmart if needed differently */
        margin-bottom: 0; /* Remove extra margin if combined with h1 */
    }

    .rk-logo { /* Specific style for RK - QUICKSTORE */
        font-size: 38px; /* Slightly smaller than main logo */
        margin-top: 5px; /* Adjust spacing */
        margin-bottom: 20px;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 10px rgba(106,17,203,0.3); }
      100% { text-shadow: 0 0 20px rgba(192, 195, 198, 0.5); }
    }

    .container h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
    }

    .container p {
      font-size: 1em;
      color: #555;
      margin-bottom: 30px;
    }

    .btn-enter {
      padding: 15px 30px;
      font-size: 1.1em;
      font-weight: bold;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      color: var(--white);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .btn-enter:hover {
      transform: scale(1.05);
      background: linear-gradient(to right, var(--secondary), var(--primary));
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0); }
      100% { transform: rotate(360deg); }
    }

    footer {
      position: absolute;
      bottom: 10px;
      font-size: 0.9em;
      color: var(--white); /* Changed to var(--white) for better visibility */
      z-index: 1;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .container {
            padding: 30px 20px;
        }
        .logo {
            font-size: 40px;
        }
        .rk-logo {
            font-size: 32px;
        }
        .container h1 {
            font-size: 1.8em;
        }
        .container p {
            font-size: 0.9em;
        }
        .btn-enter {
            padding: 12px 25px;
            font-size: 1em;
        }
    }

    @media (max-width: 480px) {
        .container {
            padding: 25px 15px;
        }
        .logo {
            font-size: 35px;
        }
        .rk-logo {
            font-size: 28px;
        }
        .container h1 {
            font-size: 1.5em;
        }
        .container p {
            font-size: 0.8em;
        }
        .btn-enter {
            padding: 10px 20px;
            font-size: 0.9em;
        }
        .bubble, .sparkle { display: none; /* Hide bubbles and sparkles on smaller screens if they become too distracting */ }
    }
  </style>
</head>
<body>
  <div class="background">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>
  </div>

  <div class="container">
    <h1>WELCOME TO</h1>
    <div class="logo shopsmart-logo">ShopSmart</div>
    <div class="logo rk-logo">RK - QUICKSTORE</div>
    <p>Find amazing deals on fashion, electronics, lifestyle, and more. Enjoy premium quality and great service.</p>
    <button class="btn-enter" id="enterStoreBtn">
      <span>Enter Store</span>
      <i class="fas fa-arrow-right"></i>
      <div class="spinner" id="spinner"></div>
    </button>
  </div>

  <footer>
    &copy; 2025 ShopSmart | Made with ❤️ by Raj Kiran
  </footer>

  <script>
    document.getElementById('enterStoreBtn').addEventListener('click', function () {
      const button = this;
      const buttonText = button.querySelector('span');
      const buttonIcon = button.querySelector('i');
      const spinner = document.getElementById('spinner');

      buttonText.style.display = 'none';
      buttonIcon.style.display = 'none';
      spinner.style.display = 'inline-block';
      button.style.pointerEvents = 'none';

      setTimeout(() => {
        window.location.href = "products.html";
      }, 2000);
    });
  </script>
</body>
</html>
